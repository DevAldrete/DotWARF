services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dotwarf
      POSTGRES_PASSWORD: dotwarf
      POSTGRES_DB: dotwarf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotwarf"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dotwarf:dotwarf@db:5432/dotwarf
    env_file:
      - ./api/.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
